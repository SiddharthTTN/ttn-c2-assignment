spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/support_tickets}
    username: ${DATABASE_USERNAME:support}
    password: ${DATABASE_PASSWORD:change-me-local-db-password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    locations: classpath:db/migration/postgres
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${OLLAMA_CHAT_MODEL:llama3.2:3b}
      embedding:
        options:
          model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

app:
  rag:
    ask-timeout: ${ASK_TIMEOUT:7500ms}
  ollama:
    http:
      connect-timeout: ${OLLAMA_HTTP_CONNECT_TIMEOUT:2s}
      read-timeout: ${OLLAMA_HTTP_READ_TIMEOUT:7s}
